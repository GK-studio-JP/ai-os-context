[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-os-context"
version = "0.1.0"
description = "Deterministic replay and bounded context capsules for GitHub-native AI coordination"
requires-python = ">=3.11"
authors = [{name = "GK-studio-JP"}]
dependencies = []

[project.scripts]
aios-context = "ai_os_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
