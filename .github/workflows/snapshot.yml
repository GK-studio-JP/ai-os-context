name: projection snapshot

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Canonical bulletin-board repository (owner/name)
        required: true
        default: GK-studio-JP/ai-bulletin-board
      state:
        description: Issue state to project
        required: true
        type: choice
        default: open
        options:
          - open
          - all
          - closed
      default_process:
        description: Fallback process for legacy Issues without ai-os-task:v1
        required: false
        default: PROC-BULLETIN
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/snapshot.yml'

permissions:
  contents: read

concurrency:
  group: projection-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.AIOS_GITHUB_TOKEN || github.token }}
      SOURCE_REPOSITORY: ${{ inputs.repository || 'GK-studio-JP/ai-bulletin-board' }}
      ISSUE_STATE: ${{ inputs.state || 'open' }}
      DEFAULT_PROCESS: ${{ inputs.default_process || 'PROC-BULLETIN' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Build bounded projection
        shell: bash
        run: |
          args=(
            snapshot
            --repo "$SOURCE_REPOSITORY"
            --state "$ISSUE_STATE"
            --output-dir projection
          )
          if [[ -n "$DEFAULT_PROCESS" ]]; then
            args+=(--default-process "$DEFAULT_PROCESS")
          fi
          aios-context "${args[@]}"
      - name: Validate projection
        run: |
          test -s projection/manifest.json
          test -s projection/scheduler-view.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("projection")
          manifest = json.loads((root / "manifest.json").read_text())
          view = json.loads((root / "scheduler-view.json").read_text())
          assert manifest["schema"] == "ai-os-projection-manifest:v1"
          assert manifest["authoritative"] is False
          assert view["schema"] == "ai-os-scheduler-view:v1"
          assert view["authoritative"] is False
          assert manifest["generated_at"] == view["generated_at"]
          for task in manifest["tasks"]:
              capsule = json.loads((root / task["capsule"]).read_text())
              assert capsule["authoritative"] is False
              assert capsule["source"]["task"] == task["task"]
          print("LIVE_PROJECTION_OK", len(manifest["tasks"]))
          PY
      - name: Upload projection artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-os-projection
          path: projection/
          if-no-files-found: error
          retention-days: 7
