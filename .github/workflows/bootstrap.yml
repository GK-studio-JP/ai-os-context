name: Bootstrap ai-os-context

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install project snapshot
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/ai-os-context.tar.gz
          tar -xzf /tmp/ai-os-context.tar.gz
          rm -f .github/workflows/test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bootstrap ai-os-context v0.1'
          git push
