name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: aios-context replay-files --issue-file examples/issue.json --comments-file examples/comments.json --at 2026-09-19T00:12:00Z > /tmp/replay.json
      - run: aios-context capsule-files --issue-file examples/issue.json --comments-file examples/comments.json --process PROC-AUTH --repo GK-studio-JP/ai-bulletin-board --max-chars 20000 --at 2026-09-19T00:12:00Z > /tmp/capsule.json
      - run: python -c "import json; c=json.load(open('/tmp/capsule.json')); assert c['context_budget']['max_chars'] == 20000; assert c['source']['source_fingerprint'].startswith('sha256:')"
