name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: aios-context replay-files --issue-file examples/issue.json --comments-file examples/comments.json --at 2026-09-19T00:12:00Z > /tmp/replay.json
      - run: aios-context capsule-files --issue-file examples/issue.json --comments-file examples/comments.json --process PROC-AUTH --repo GK-studio-JP/ai-bulletin-board --at 2026-09-19T00:12:00Z > /tmp/capsule.json
